input AddRenewalInput {
  assetId: ID!
  expiresAt: DateTime!
  kind: RenewalKind!
  title: String!
}

input AddTaskInput {
  assetId: ID!

  """A known due date (service sticker); the earliest side wins"""
  dueAt: DateTime
  everyKm: Int
  everyMonths: Int

  """Defaults to now"""
  lastDoneAt: DateTime
  lastDoneKm: Float
  title: String!
}

type Asset {
  createdAt: DateTime!

  """Null until two full tanks"""
  fuelEconomy: FuelEconomy

  """Lowest odometer first"""
  fuelUps: [FuelUp!]!
  id: ID!
  kind: AssetKind!
  name: String!
  readings: [Reading!]!
  renewals: [Renewal!]!
  tasks: [MaintenanceTask!]!
  usage: Usage!
}

enum AssetKind {
  APPLIANCE
  CAR
  HOME
}

type BillEstimate {
  bandIndex: Int!
  currency: String!
  fee: Float!
  kwh: Float!
  lines: [BillLine!]!
  total: Float!
}

type BillLine {
  amount: Float!
  kwh: Float!
  pricePerKwh: Float!
}

input CompleteTaskInput {
  doneAt: DateTime
  doneKm: Float
  taskId: ID!
}

type ConsumptionPeriod {
  from: DateTime!
  perDay: Float!
  to: DateTime!
  units: Float!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type Due {
  dueAt: DateTime!
  dueKm: Float
  reason: DueReason!
}

type DueItem {
  asset: Asset
  assetId: ID!
  dueAt: DateTime!
  dueKm: Float
  reason: DueReason!
  subjectId: ID!
  subjectType: SubjectType!
  title: String!
}

"""Which side of the rule decided the due date"""
enum DueReason {
  DISTANCE
  EXPIRY
  FIXED_DATE
  TIME
}

"""Full-to-full: only stretches between two full tanks count"""
type FuelEconomy {
  cost: Float!
  costPerKm: Float!
  distanceKm: Float!
  litres: Float!
  litresPer100Km: Float!
}

type FuelUp {
  at: DateTime!
  cost: Float!
  fullTank: Boolean!
  id: ID!
  litres: Float!
  odometerKm: Float!
}

type MaintenanceTask {
  assetId: ID!

  """Whichever comes first of time, distance and a fixed date"""
  due: Due
  everyKm: Int
  everyMonths: Int
  id: ID!
  lastDoneAt: DateTime!
  lastDoneKm: Float
  reminders: [Reminder!]!
  title: String!
}

enum Meter {
  ELECTRICITY_KWH
  ODOMETER_KM
}

type Mutation {
  addRenewal(input: AddRenewalInput!): Renewal!

  """Reminders are planned asynchronously by the reminder saga"""
  addTask(input: AddTaskInput!): MaintenanceTask!

  """Done: the baseline resets and the next due date is planned"""
  completeTask(input: CompleteTaskInput!): MaintenanceTask!
  markNotificationRead(id: ID!): Notification!

  """Also records the odometer reading, so km-based due dates move"""
  recordFuelUp(input: RecordFuelUpInput!): FuelUp!

  """Odometer (car) or electricity meter (home); must not go backwards"""
  recordReading(input: RecordReadingInput!): Reading!
  registerAsset(input: RegisterAssetInput!): Asset!
  renew(expiresAt: DateTime!, id: ID!): Renewal!

  """Push one reminder later by some hours (max 30 days)"""
  snoozeReminder(hours: Float!, id: ID!): Reminder!
}

type Notification {
  assetId: ID!
  createdAt: DateTime!
  id: ID!
  message: String!
  readAt: DateTime
  reminderId: ID!
  title: String!
}

type Query {
  asset(id: ID!): Asset
  assets: [Asset!]!

  """Tasks and renewals due within the window, overdue first"""
  dueSoon(withinDays: Int! = 30): [DueItem!]!
  notifications(limit: Int! = 20, unreadOnly: Boolean! = false): [Notification!]!
}

type Reading {
  at: DateTime!
  id: ID!
  meter: Meter!
  value: Float!
}

input RecordFuelUpInput {
  assetId: ID!
  at: DateTime
  cost: Float!
  fullTank: Boolean! = true
  litres: Float!

  """Odometer at the pump; recorded as a reading too"""
  odometerKm: Float!
}

input RecordReadingInput {
  assetId: ID!
  at: DateTime
  value: Float!
}

input RegisterAssetInput {
  kind: AssetKind!
  name: String!
}

type Reminder {
  dueAt: DateTime!
  fireAt: DateTime!
  id: ID!

  """0 is the reminder at the due moment itself"""
  leadDays: Float!
  status: ReminderStatus!
  subjectId: ID!
  subjectType: SubjectType!
  title: String!
}

enum ReminderStatus {
  CANCELLED
  FIRED
  SCHEDULED
  SNOOZED
}

type Renewal {
  assetId: ID!
  expiresAt: DateTime!
  id: ID!
  kind: RenewalKind!
  reminders: [Reminder!]!
  title: String!
}

enum RenewalKind {
  INSPECTION
  INSURANCE
  LICENSE
  OTHER
  WARRANTY
}

enum SubjectType {
  RENEWAL
  TASK
}

type Subscription {
  """
  Live reminders over graphql-ws, fanned out from the worker through Redis
  """
  notificationAdded: Notification!
}

type Usage {
  monthlyBill: BillEstimate

  """km or kWh per day over the last 90 days"""
  perDay: Float
  periods: [ConsumptionPeriod!]!
}
