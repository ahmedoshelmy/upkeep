type AssetType {
  id: ID!
  kind: AssetKind!
  name: String!
  createdAt: DateTime!
  tasks: [MaintenanceTask!]!
  renewals: [Renewal!]!
  readings: [Reading!]!
  usage: Usage!
}

enum AssetKind {
  CAR
  HOME
  APPLIANCE
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type Reminder {
  id: ID!
  subjectType: SubjectType!
  subjectId: ID!
  title: String!
  dueAt: DateTime!
  fireAt: DateTime!

  """
  0 is the reminder at the due moment itself
  """
  leadDays: Float!
  status: ReminderStatus!
}

enum SubjectType {
  TASK
  RENEWAL
}

enum ReminderStatus {
  SCHEDULED
  FIRED
  CANCELLED
  SNOOZED
}

type MaintenanceTask {
  id: ID!
  assetId: ID!
  title: String!
  everyKm: Int
  everyMonths: Int
  lastDoneAt: DateTime!
  lastDoneKm: Float

  """
  Whichever comes first of time, distance and a fixed date
  """
  due: Due
  reminders: [Reminder!]!
}

type Renewal {
  id: ID!
  assetId: ID!
  kind: RenewalKind!
  title: String!
  expiresAt: DateTime!
  reminders: [Reminder!]!
}

enum RenewalKind {
  LICENSE
  INSURANCE
  WARRANTY
  INSPECTION
  OTHER
}

type Reading {
  id: ID!
  meter: Meter!
  at: DateTime!
  value: Float!
}

enum Meter {
  ODOMETER_KM
  ELECTRICITY_KWH
}

type Due {
  dueAt: DateTime!
  dueKm: Float
  reason: DueReason!
}

"""
Which side of the rule decided the due date
"""
enum DueReason {
  TIME
  DISTANCE
  FIXED_DATE
  EXPIRY
}

type DueItem {
  dueAt: DateTime!
  dueKm: Float
  reason: DueReason!
  subjectType: SubjectType!
  subjectId: ID!
  assetId: ID!
  title: String!
  asset: AssetType
}

type ConsumptionPeriod {
  from: DateTime!
  to: DateTime!
  units: Float!
  perDay: Float!
}

type BillLine {
  kwh: Float!
  pricePerKwh: Float!
  amount: Float!
}

type BillEstimate {
  kwh: Float!
  bandIndex: Int!
  lines: [BillLine!]!
  fee: Float!
  total: Float!
  currency: String!
}

type Usage {
  periods: [ConsumptionPeriod!]!

  """
  km or kWh per day over the last 90 days
  """
  perDay: Float
  monthlyBill: BillEstimate
}

type Notification {
  id: ID!
  reminderId: ID!
  assetId: ID!
  title: String!
  message: String!
  createdAt: DateTime!
  readAt: DateTime
}

type Query {
  assets: [AssetType!]!
  asset(id: ID!): AssetType

  """
  Tasks and renewals due within the window, overdue first
  """
  dueSoon(withinDays: Int! = 30): [DueItem!]!
  notifications(limit: Int! = 20, unreadOnly: Boolean! = false): [Notification!]!
}

type Mutation {
  registerAsset(input: RegisterAssetInput!): AssetType!

  """
  Reminders are planned asynchronously by the reminder saga
  """
  addTask(input: AddTaskInput!): MaintenanceTask!

  """
  Done: the baseline resets and the next due date is planned
  """
  completeTask(input: CompleteTaskInput!): MaintenanceTask!
  addRenewal(input: AddRenewalInput!): Renewal!
  renew(id: ID!, expiresAt: DateTime!): Renewal!

  """
  Odometer (car) or electricity meter (home); must not go backwards
  """
  recordReading(input: RecordReadingInput!): Reading!
  markNotificationRead(id: ID!): Notification!

  """
  Push one reminder later by some hours (max 30 days)
  """
  snoozeReminder(id: ID!, hours: Float!): Reminder!
}

input RegisterAssetInput {
  kind: AssetKind!
  name: String!
}

input AddTaskInput {
  assetId: ID!
  title: String!
  everyKm: Int
  everyMonths: Int

  """
  Defaults to now
  """
  lastDoneAt: DateTime
  lastDoneKm: Float

  """
  A known due date (service sticker); the earliest side wins
  """
  dueAt: DateTime
}

input CompleteTaskInput {
  taskId: ID!
  doneAt: DateTime
  doneKm: Float
}

input AddRenewalInput {
  assetId: ID!
  kind: RenewalKind!
  title: String!
  expiresAt: DateTime!
}

input RecordReadingInput {
  assetId: ID!
  value: Float!
  at: DateTime
}

type Subscription {
  """
  Live reminders over graphql-ws, fanned out from the worker through Redis
  """
  notificationAdded: Notification!
}
